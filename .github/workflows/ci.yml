name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, so one failure does not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Environment
        run: |
          node --version
          node -e "const os=require('os');console.log(process.platform, os.arch(), os.release())"

      - name: Syntax check every module
        shell: bash
        run: |
          for f in install.mjs lib/*.mjs bin/*.mjs test/*.mjs; do
            node --check "$f" && echo "ok   $f"
          done

      - name: Suite
        run: node test/suite.mjs

      - name: Codex host suite
        run: node test/codex.mjs

  # A green Windows run is only meaningful if the Windows-specific paths actually
  # ran, rather than being skipped. Assert the ones that matter were exercised.
  windows-specifics:
    name: windows-latest (platform paths)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The default runner account is an administrator, so a junction succeeding there
      # proves nothing about an unelevated shell, which is what a real user has.
      # runas /trustlevel:0x20000 drops to basic-user rights; if the junction still
      # works there, the no-admin claim is earned rather than assumed.
      - name: Junction without elevation (de-elevated via runas)
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'jprobe.js'
          @'
          const fs=require('fs'), os=require('os'), path=require('path');
          const d=fs.mkdtempSync(path.join(os.tmpdir(),'jl-'));
          const target=path.join(d,'t'); fs.mkdirSync(target);
          fs.writeFileSync(path.join(target,'f.txt'),'hi');
          const link=path.join(d,'l');
          try {
            fs.symlinkSync(target, link, 'junction');
            const ok = fs.lstatSync(link).isSymbolicLink()
                    && fs.readFileSync(path.join(link,'f.txt'),'utf8') === 'hi';
            console.log(ok ? 'JUNCTION_OK' : 'JUNCTION_BAD');
          } catch (e) { console.log('JUNCTION_FAIL ' + e.code); }
          '@ | Set-Content -LiteralPath $probe -Encoding UTF8

          $out = Join-Path $env:RUNNER_TEMP 'jprobe.txt'
          Remove-Item $out -ErrorAction SilentlyContinue
          $node = (Get-Command node).Source
          # /trustlevel needs the whole thing as one quoted command string.
          $cmd = "cmd /c `"`"$node`" `"$probe`" > `"$out`" 2>&1`""
          Write-Host "running de-elevated: $cmd"
          runas /trustlevel:0x20000 $cmd
          Start-Sleep -Seconds 6

          if (-not (Test-Path $out)) {
            Write-Host "::warning::runas produced no output; could not de-elevate on this runner. Claim remains unproven."
            exit 0
          }
          $res = (Get-Content -LiteralPath $out -Raw).Trim()
          Write-Host "de-elevated result: $res"
          if ($res -match 'JUNCTION_OK') {
            Write-Host 'Junction created by a basic-user token. No-admin claim proven.'
          } elseif ($res -match 'JUNCTION_FAIL|JUNCTION_BAD') {
            throw "junction failed without elevation: $res"
          } else {
            Write-Host "::warning::unrecognised output, claim remains unproven: $res"
          }
          exit 0

      - name: Junction created (elevated baseline)
        shell: pwsh
        run: |
          node -e "
            const fs=require('fs'), os=require('os'), path=require('path');
            const d=fs.mkdtempSync(path.join(os.tmpdir(),'jt-'));
            const target=path.join(d,'target'); fs.mkdirSync(target);
            fs.writeFileSync(path.join(target,'f.txt'),'hi');
            const link=path.join(d,'link');
            fs.symlinkSync(target,link,'junction');
            const st=fs.lstatSync(link);
            if(!st.isSymbolicLink()) { console.error('not a link'); process.exit(1); }
            if(fs.readFileSync(path.join(link,'f.txt'),'utf8')!=='hi'){console.error('unreadable');process.exit(1);}
            console.log('junction ok, readlink ->', fs.readlinkSync(link));
          "
          whoami
          Write-Host "Elevated: $((New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"

      - name: schtasks register and remove
        shell: pwsh
        run: |
          schtasks /Create /TN CiProbeTask /TR "cmd /c echo hi" /SC DAILY /ST 07:30 /F
          schtasks /Query /TN CiProbeTask /FO LIST | Select-String "TaskName","Next Run Time"
          schtasks /Delete /TN CiProbeTask /F
          # A query for a deleted task exits 1, and GitHub's pwsh shell fails the step
          # on a non-zero $LASTEXITCODE, so check the text and reset it explicitly.
          $q = (schtasks /Query /TN CiProbeTask 2>&1 | Out-String)
          if ($q -notmatch 'cannot find|does not exist') { throw "task survived deletion: $q" }
          Write-Host "schtasks register and remove ok"
          exit 0

      - name: which() uses `where` on Windows
        shell: pwsh
        run: |
          node --input-type=module -e "
            const { which, has, LINK_TYPE, PLATFORM } = await import('./lib/platform.mjs');
            console.log('PLATFORM  :', PLATFORM);
            console.log('LINK_TYPE :', LINK_TYPE);
            console.log('which node:', which('node'));
            console.log('has(nope) :', has('definitely-not-a-real-command-xyz'));
            if (LINK_TYPE !== 'junction') { console.error('wrong link type'); process.exit(1); }
            if (!which('node')) { console.error('which() failed to find node'); process.exit(1); }
            if (has('definitely-not-a-real-command-xyz')) { console.error('has() false positive'); process.exit(1); }
          "
